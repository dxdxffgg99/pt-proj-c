name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++

          - name: macos-appleclang
            os: macos-latest
            cc: clang
            cxx: clang++
            
          - name: windows-gnu
            os: windows-latest
            msys2: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows only)
        if: matrix.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure & Build (Windows/MSYS2)
        if: matrix.msys2
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify compiler ID (Windows/MSYS2)
        if: matrix.msys2
        shell: msys2 {0}
        run: |
          grep -q "GNU" build/CMakeCache.txt && echo "OK: GNU"

      - name: Configure & Build (Linux/macOS)
        if: matrix.msys2 != true
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
